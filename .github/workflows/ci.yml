name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Full `pnpm run typecheck` is red on the generated OpenAI integration
      # libs (`lib/integrations-openai-ai-*`). CI typechecks the shared
      # packages we own, then relies on esbuild/vite for the apps.
      - name: Typecheck shared libs
        run: pnpm run ci:typecheck

      - name: Test
        run: pnpm run ci:test

      - name: Build
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: pnpm run ci:build
